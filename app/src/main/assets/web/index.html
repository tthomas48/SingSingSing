<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sing Tidal To Me</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <header>
      <p class="brand">Sing Tidal To Me</p>
      <p id="statusLine" class="status">Connecting…</p>
    </header>

    <section id="joinPanel" class="panel">
      <h1>Join the party</h1>
      <p class="lede">Pick a name so everyone knows who queued the bangers.</p>
      <form id="joinForm">
        <label for="nameInput">Your name</label>
        <input id="nameInput" name="name" maxlength="24" autocomplete="nickname" placeholder="e.g. Tim" required />
        <button type="submit">Join</button>
      </form>
    </section>

    <section id="partyPanel" class="panel hidden">
      <div class="nowPlaying">
        <div class="nowPlaying-meta">
          <p class="eyebrow">Now singing</p>
          <div class="nowPlaying-title-row">
            <h2 id="nowTitle">Nothing yet</h2>
            <div class="nowPlaying-actions">
              <button type="button" id="nowLyrics" class="now-action-btn hidden" aria-label="Live lyrics"></button>
              <button type="button" id="nowHeart" class="now-action-btn heart-btn hidden" aria-label="Add to karaoke library"></button>
            </div>
          </div>
          <p id="nowArtist" class="muted"></p>
          <p id="nowBy" class="muted"></p>
        </div>
        <div class="transport" role="group" aria-label="Playback controls">
          <button type="button" class="icon-btn" data-action="previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="playPauseBtn" data-action="toggle-play" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-action="skip" aria-label="Skip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button type="button" class="text-btn" id="openLyrics" aria-label="Open lyrics on TV">Open Lyrics</button>
        </div>
      </div>

      <div class="addRow">
        <button type="button" id="openAddModal" class="add-btn">Add a song</button>
      </div>

      <div class="feed">
        <div class="feed-tabs" role="tablist">
          <button type="button" class="feed-tab active" data-feed-tab="queue" role="tab" aria-selected="true">Session queue</button>
          <button type="button" class="feed-tab" data-feed-tab="chatter" role="tab" aria-selected="false">Party chatter</button>
        </div>
        <section id="queuePane" class="feed-pane" role="tabpanel">
          <div id="queueViewport" class="queue-viewport">
            <ul id="queueList" class="list queue"></ul>
          </div>
        </section>
        <section id="chatterPane" class="feed-pane hidden" role="tabpanel">
          <div id="chatterViewport" class="chatter-viewport">
            <ul id="messageList" class="list messages"></ul>
          </div>
          <form id="chatterForm" class="chatter-compose">
            <input id="chatterInput" maxlength="120" autocomplete="off" placeholder="Say something to the party" />
            <button type="submit">Send</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <div id="lyricsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="lyricsModalTitle">
    <div class="modal-backdrop" data-close-lyrics-modal></div>
    <div class="modal-sheet panel lyrics-modal-sheet">
      <div class="row between">
        <div>
          <p class="eyebrow">Live lyrics</p>
          <h2 id="lyricsModalTitle">Lyrics</h2>
          <p id="lyricsModalArtist" class="muted"></p>
        </div>
        <button type="button" class="secondary" data-close-lyrics-modal>Close</button>
      </div>
      <div id="lyricsLines" class="lyrics-lines" aria-live="polite"></div>
    </div>
  </div>

  <div id="addModal" class="modal add-modal hidden" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-sheet panel add-modal-sheet">
      <div class="add-modal-chrome">
        <div class="row between">
          <h2 id="addModalTitle">Add a song</h2>
          <button type="button" class="secondary" data-close-modal>Close</button>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="library" role="tab" aria-selected="true">Library</button>
          <button type="button" class="tab" data-tab="tidal" role="tab" aria-selected="false">Search all Tidal</button>
        </div>
        <form id="libraryForm" class="search">
          <label for="libraryInput">Browse karaoke library</label>
          <div class="row">
            <input id="libraryInput" type="search" enterkeyhint="search" placeholder="Filter library songs" />
            <button type="submit">Filter</button>
          </div>
          <p id="libraryHint" class="muted tiny"></p>
        </form>
        <form id="searchForm" class="search hidden">
          <label for="searchInput">Search Tidal</label>
          <div class="row">
            <input id="searchInput" type="search" enterkeyhint="search" placeholder="Song or artist" />
            <button type="submit">Search</button>
          </div>
        </form>
        <div id="addBusyBar" class="add-busy-bar hidden" role="progressbar" aria-hidden="true" aria-label="Working"></div>
      </div>
      <div id="searchResults" class="results"></div>
    </div>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
